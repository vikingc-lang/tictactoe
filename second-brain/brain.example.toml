# Second Brain configuration.  Copy to ~/.secondbrain/brain.toml (or run `brain init`).
# Use ${ENV_VAR} for secrets - never paste tokens into this file.

[brain]
data_dir = "~/.secondbrain"               # brain.db (the whole brain, one portable file) lives here
output_dir = "~/SecondBrain/Outputs"      # generated docs and decks
model = "claude-opus-5"
effort = "high"                           # low | medium | high | xhigh | max
learn_from_outputs = true                 # index what the brain creates, so it builds on its own work
auto_enrich = false                       # have Claude summarise, tag and entity-link new docs on every sync
watch_interval = 60                       # seconds between syncs for `brain watch`
# deck_template = "~/Templates/firm-master.pptx"   # build decks on your branded master
# doc_template  = "~/Templates/firm-letterhead.docx"

# ---------------------------------------------------------------- offline / local folders
[[sources]]
name = "notes"
type = "folder"
path = "~/Documents/Notes"                # Obsidian vaults work great ([[wikilinks]] become graph edges)

