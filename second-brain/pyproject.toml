[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "0.3.0"
description = "Personal knowledge system: connect folders, drives and APIs; link and learn; answer and create docs and decks with Claude."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "mcp>=2.2",
    "pydantic>=2",
    "pypdf>=4",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
excel = ["openpyxl"]
gdrive = ["google-api-python-client", "google-auth"]
outlook = ["extract-msg"]
dev = ["pytest"]

[project.scripts]
brain = "secondbrain.cli:main"

[tool.setuptools.packages.find]
include = ["secondbrain*"]

[tool.setuptools.package-data]
secondbrain = ["ui/*.html"]
